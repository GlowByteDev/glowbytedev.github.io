<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Hub & Goal Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-2 shrink-0 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-2">
            <div class="bg-indigo-600 p-1.5 rounded-lg shadow-md shadow-indigo-500/30">
                <i class="fa-solid fa-trophy text-white text-xs"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold tracking-tight text-white leading-tight">Tournament Hub</h1>
                <p class="text-[9px] text-slate-400">Scoreboard, Goals & Streams</p>
            </div>
        </div>

        <!-- Global Tournament Stats Counter -->
        <div class="bg-slate-900/80 border border-slate-700/80 px-3 py-1 rounded-xl flex items-center gap-3 shadow-inner">
            <div class="text-center">
                <span class="block text-[8px] uppercase tracking-wider text-slate-400 font-semibold">Teams</span>
                <span id="global-teams-count" class="text-xs font-black text-indigo-400">0</span>
            </div>
            <div class="h-5 w-px bg-slate-700"></div>
            <div class="text-center">
                <span class="block text-[8px] uppercase tracking-wider text-slate-400 font-semibold">Total Goals</span>
                <span id="global-goals-count" class="text-xs font-black text-emerald-400">0</span>
            </div>
        </div>
    </header>

    <!-- Main Container - Single Screen Layout Grid -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-2.5 grid grid-cols-1 lg:grid-cols-12 gap-2.5 overflow-hidden">

        <!-- Left Column: Teams & Controls (Takes up 7 cols) -->
        <section class="lg:col-span-7 flex flex-col gap-2 overflow-hidden">
            <!-- Toolbar -->
            <div class="bg-slate-800/60 border border-slate-700/60 px-3 py-1.5 rounded-xl flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2">
                    <button onclick="addTeam()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-2.5 py-1 rounded-lg text-xs transition shadow-sm flex items-center gap-1 cursor-pointer">
                        <i class="fa-solid fa-plus text-[9px]"></i> Add Team
                    </button>
                    <button onclick="openGoalModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-2.5 py-1 rounded-lg text-xs transition shadow-sm flex items-center gap-1 cursor-pointer">
                        <i class="fa-solid fa-bullseye text-[9px]"></i> Add Goal
                    </button>
                    <button onclick="resetAllStats()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium px-2 py-1 rounded-lg text-xs transition flex items-center gap-1 cursor-pointer">
                        <i class="fa-solid fa-rotate-right text-[9px]"></i> Reset
                    </button>
                </div>
                <span class="text-[10px] text-slate-400"><i class="fa-solid fa-circle-info text-indigo-400"></i> Min 2 teams</span>
            </div>

            <!-- Teams Scrollable Container -->
            <div id="teams-container" class="flex-1 overflow-y-auto space-y-2 pr-1">
                <!-- Injected Team Cards -->
            </div>
        </section>

        <!-- Right Column: Goals Tracker & YouTube Widget (Takes up 5 cols) -->
        <section class="lg:col-span-5 flex flex-col gap-2 overflow-hidden">
            
            <!-- Team Goal Missions Box -->
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-2.5 flex flex-col h-1/2 overflow-hidden shadow-sm">
                <div class="flex items-center justify-between pb-1.5 shrink-0 border-b border-slate-700/60">
                    <h2 class="text-xs font-bold text-white flex items-center gap-1.5">
                        <i class="fa-solid fa-flag-checkered text-amber-400"></i> Active Team Goals (+5 Pts Reward)
                    </h2>
                    <span id="goals-badge" class="text-[10px] bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded-full font-semibold">0</span>
                </div>
                <!-- Scrollable list of user-created goals -->
                <div id="missions-container" class="flex-1 overflow-y-auto space-y-1.5 pt-1.5 pr-1">
                    <div class="text-center text-slate-500 text-[11px] py-4">No active team goals. Click "Add Goal" above to create one!</div>
                </div>
            </div>

            <!-- YouTube Stream Widget Box -->
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-2.5 flex flex-col h-1/2 overflow-hidden shadow-sm">
                <div class="flex items-center justify-between gap-2 pb-1.5 shrink-0">
                    <h2 class="text-xs font-bold text-white flex items-center gap-1.5">
                        <i class="fa-brands fa-youtube text-red-500 text-sm"></i> YouTube Stream
                    </h2>
                    <div class="flex items-center gap-1 flex-1 max-w-[220px]">
                        <input type="text" id="youtube-url-input" placeholder="Paste YouTube Link..." 
                            class="w-full px-2 py-1 bg-slate-900 border border-slate-700 rounded text-[11px] text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                        <button onclick="embedYouTubeVideo()" class="bg-red-600 hover:bg-red-500 text-white font-medium px-2 py-1 rounded text-[11px] cursor-pointer shrink-0">
                            Load
                        </button>
                    </div>
                </div>

                <!-- Video Frame Area -->
                <div class="flex-1 bg-slate-900 border border-slate-700/80 rounded-lg overflow-hidden flex flex-col justify-center items-center relative">
                    <div id="youtube-player-wrapper" class="hidden w-full h-full relative"></div>
                    <div id="youtube-placeholder" class="p-2 text-center text-slate-500 text-[11px] flex items-center gap-1.5">
                        <i class="fa-solid fa-film text-slate-600"></i>
                        <span>Paste a link to load video player.</span>
                    </div>
                </div>
            </div>

        </section>

    </main>

    <!-- Create Goal Modal -->
    <div id="goal-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 w-full max-w-sm shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-bullseye text-emerald-400"></i> Assign Goal to Team
                </h3>
                <button onclick="closeGoalModal()" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Select Team</label>
                    <select id="modal-team-select" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                        <!-- Populated dynamically -->
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-semibold text-slate-400 mb-1">Goal Description / Task</label>
                    <input type="text" id="modal-goal-desc" placeholder="e.g. Score from outside the box" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
            </div>
            <div class="flex items-center justify-end gap-2 pt-2">
                <button onclick="closeGoalModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-lg text-xs cursor-pointer">Cancel</button>
                <button onclick="saveNewGoal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium cursor-pointer shadow-sm">Save & Assign Goal</button>
            </div>
        </div>
    </div>

    <!-- Application Logic Script -->
    <script>
        let teams = [
            { id: 1, name: "Red Dragons", points: 0, goals: 0 },
            { id: 2, name: "Blue Titans", points: 0, goals: 0 }
        ];

        let missions = []; // Custom user goals list

        function loadState() {
            const savedTeams = localStorage.getItem('tournament_hub_teams_v2');
            const savedMissions = localStorage.getItem('tournament_hub_missions_v2');
            if (savedTeams) {
                try {
                    const parsed = JSON.parse(savedTeams);
                    if (Array.isArray(parsed) && parsed.length >= 2) teams = parsed;
                } catch(e) {}
            }
            if (savedMissions) {
                try {
                    const parsed = JSON.parse(savedMissions);
                    if (Array.isArray(parsed)) missions = parsed;
                } catch(e) {}
            }
        }

        function saveState() {
            localStorage.setItem('tournament_hub_teams_v2', JSON.stringify(teams));
            localStorage.setItem('tournament_hub_missions_v2', JSON.stringify(missions));
        }

        function render() {
            renderTeams();
            renderMissions();
            saveState();
        }

        function renderTeams() {
            const container = document.getElementById('teams-container');
            container.innerHTML = '';
            let totalGoals = 0;

            teams.forEach((team, index) => {
                totalGoals += team.goals;
                const card = document.createElement('div');
                card.className = "bg-slate-800 border border-slate-700/80 rounded-xl p-2.5 shadow-sm flex flex-col gap-2 transition hover:border-slate-600";
                
                card.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2 flex-1 min-w-0">
                            <span class="text-[10px] font-bold text-indigo-400 bg-slate-700/50 px-1.5 py-0.5 rounded">#${index + 1}</span>
                            <input type="text" value="${escapeHtml(team.name)}" onchange="updateTeamName(${team.id}, this.value)"
                                class="w-full bg-transparent font-bold text-xs text-white border-b border-transparent hover:border-slate-600 focus:border-indigo-500 focus:outline-none px-1 py-0.5 truncate">
                        </div>
                        ${teams.length > 2 ? `
                            <button onclick="removeTeam(${team.id})" class="text-slate-500 hover:text-red-400 p-1 rounded transition cursor-pointer" title="Remove Team">
                                <i class="fa-solid fa-trash-can text-[11px]"></i>
                            </button>
                        ` : `
                            <button disabled class="text-slate-600 p-1 rounded opacity-30 cursor-not-allowed" title="Min 2 teams required">
                                <i class="fa-solid fa-trash-can text-[11px]"></i>
                            </button>
                        `}
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-700/50">
                        <!-- Points Controller -->
                        <div class="bg-slate-900/60 border border-slate-700/40 rounded-lg p-1.5 flex items-center justify-between">
                            <div>
                                <span class="block text-[8px] uppercase tracking-wider text-slate-400 font-semibold">Points</span>
                                <span class="text-sm font-black text-indigo-400">${team.points}</span>
                            </div>
                            <div class="flex items-center gap-1">
                                <button onclick="modifyPoints(${team.id}, -1)" class="w-5 h-5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded border border-slate-700 text-[10px] cursor-pointer">-</button>
                                <button onclick="modifyPoints(${team.id}, 1)" class="w-5 h-5 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 font-bold rounded border border-indigo-500/30 text-[10px] cursor-pointer">+</button>
                            </div>
                        </div>

                        <!-- Match Goals Controller -->
                        <div class="bg-slate-900/60 border border-slate-700/40 rounded-lg p-1.5 flex items-center justify-between">
                            <div>
                                <span class="block text-[8px] uppercase tracking-wider text-slate-400 font-semibold">Goals</span>
                                <span class="text-sm font-black text-emerald-400">${team.goals}</span>
                            </div>
                            <div class="flex items-center gap-1">
                                <button onclick="modifyGoals(${team.id}, -1)" class="w-5 h-5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded border border-slate-700 text-[10px] cursor-pointer">-</button>
                                <button onclick="modifyGoals(${team.id}, 1)" class="w-5 h-5 bg-emerald-600/30 hover:bg-emerald-600/50 text-emerald-300 font-bold rounded border border-emerald-500/30 text-[10px] cursor-pointer">+</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('global-teams-count').innerText = teams.length;
            document.getElementById('global-goals-count').innerText = totalGoals;
        }

        function renderMissions() {
            const container = document.getElementById('missions-container');
            container.innerHTML = '';
            document.getElementById('goals-badge').innerText = missions.filter(m => !m.redeemed).length;

            if (missions.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 text-[11px] py-4">No goals added yet. Click "Add Goal" to set challenges!</div>`;
                return;
            }

            missions.forEach(mission => {
                const team = teams.find(t => t.id === mission.teamId);
                const teamName = team ? team.name : 'Unknown Team';

                const div = document.createElement('div');
                div.className = `p-2 rounded-lg border flex items-center justify-between gap-2 transition ${mission.redeemed ? 'bg-slate-900/30 border-slate-800 opacity-60' : 'bg-slate-900/80 border-slate-700/70'}`;
                
                div.innerHTML = `
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-1.5">
                            <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 truncate">${escapeHtml(teamName)}</span>
                            ${mission.redeemed ? '<span class="text-[9px] text-emerald-400 font-semibold"><i class="fa-solid fa-check"></i> Redeemed (+5 pts)</span>' : '<span class="text-[9px] text-amber-400 font-semibold">Active (+5 pts)</span>'}
                        </div>
                        <p class="text-xs text-slate-200 mt-1 truncate font-medium" title="${escapeHtml(mission.description)}">${escapeHtml(mission.description)}</p>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        ${!mission.redeemed ? `
                            <button onclick="redeemMission(${mission.id})" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-bold px-2 py-1 rounded transition shadow-sm cursor-pointer flex items-center gap-1">
                                <i class="fa-solid fa-gift"></i> Redeem
                            </button>
                        ` : ''}
                        <button onclick="deleteMission(${mission.id})" class="text-slate-500 hover:text-red-400 p-1 text-xs cursor-pointer" title="Delete Goal">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // Modal Controls
        function openGoalModal() {
            const select = document.getElementById('modal-team-select');
            select.innerHTML = '';
            teams.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.id;
                opt.innerText = t.name;
                select.appendChild(opt);
            });
            document.getElementById('modal-goal-desc').value = '';
            document.getElementById('goal-modal').classList.remove('hidden');
            document.getElementById('goal-modal').classList.add('flex');
        }

        function closeGoalModal() {
            document.getElementById('goal-modal').classList.remove('flex');
            document.getElementById('goal-modal').classList.add('hidden');
        }

        function saveNewGoal() {
            const teamId = parseInt(document.getElementById('modal-team-select').value);
            const desc = document.getElementById('modal-goal-desc').value.trim();

            if (!desc) {
                alert("Please enter a description for the goal.");
                return;
            }

            missions.push({
                id: Date.now(),
                teamId: teamId,
                description: desc,
                redeemed: false
            });

            closeGoalModal();
            render();
        }

        function redeemMission(id) {
            const mission = missions.find(m => m.id === id);
            if (mission && !mission.redeemed) {
                mission.redeemed = true;
                // Add 5 points to the assigned team
                const team = teams.find(t => t.id === mission.teamId);
                if (team) {
                    team.points += 5;
                }
                render();
            }
        }

        function deleteMission(id) {
            missions = missions.filter(m => m.id !== id);
            render();
        }

        // Team management
        function addTeam() {
            const newId = teams.length > 0 ? Math.max(...teams.map(t => t.id)) + 1 : 1;
            teams.push({ id: newId, name: `Team ${newId}`, points: 0, goals: 0 });
            render();
        }

        function removeTeam(id) {
            if (teams.length <= 2) return;
            teams = teams.filter(t => t.id !== id);
            render();
        }

        function updateTeamName(id, newName) {
            const team = teams.find(t => t.id === id);
            if (team) {
                team.name = newName.trim() || `Team ${id}`;
                render();
            }
        }

        function modifyPoints(id, amount) {
            const team = teams.find(t => t.id === id);
            if (team) {
                team.points = Math.max(0, team.points + amount);
                render();
            }
        }

        function modifyGoals(id, amount) {
            const team = teams.find(t => t.id === id);
            if (team) {
                team.goals = Math.max(0, team.goals + amount);
                render();
            }
        }

        function resetAllStats() {
            if (confirm("Reset all team points, goals, and clear missions?")) {
                teams.forEach(t => { t.points = 0; t.goals = 0; });
                missions = [];
                render();
            }
        }

        // YouTube Video Embedder with Fallback Thumbnail Preview Support (Error 153 mitigation)
        function embedYouTubeVideo() {
            const inputVal = document.getElementById('youtube-url-input').value.trim();
            const wrapper = document.getElementById('youtube-player-wrapper');
            const placeholder = document.getElementById('youtube-placeholder');

            if (!inputVal) return;
            const videoId = extractYouTubeId(inputVal);

            if (!videoId) {
                alert("Invalid YouTube link format.");
                return;
            }

            wrapper.innerHTML = `
                <iframe 
                    src="https://www.youtube-nocookie.com/embed/${videoId}?enablejsapi=1" 
                    title="YouTube player" 
                    class="absolute inset-0 w-full h-full border-0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    referrerpolicy="strict-origin-when-cross-origin" 
                    allowfullscreen>
                </iframe>
                <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" title="Open directly on YouTube if embed is blocked" 
                   class="absolute top-1 right-1 bg-slate-900/95 hover:bg-red-600 text-[9px] text-slate-200 px-1.5 py-0.5 rounded border border-slate-700 transition">
                    <i class="fa-solid fa-external-link-alt"></i> Open YT
                </a>
            `;

            wrapper.classList.remove('hidden');
            placeholder.classList.add('hidden');
        }

        function extractYouTubeId(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        loadState();
        render();
    </script>
</body>
</html>
